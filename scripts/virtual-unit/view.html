<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Virtual StackChan</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#15181d;--panel:#1d222a;--line:#2e3641;--text:#dfe6ee;--muted:#8fa0b3;--accent:#5aaaff;--bad:#e64646;--good:#46be6e}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}
#app{display:flex;height:100%}
#stage{flex:1;position:relative;min-width:0}
#c{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:pointer}
#hud{position:absolute;left:12px;top:12px;background:#0009;padding:8px 10px;border-radius:8px;font-size:12px;color:var(--muted)}
#side{width:360px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
section{padding:10px 12px;border-bottom:1px solid var(--line)}
h2{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,textarea,input,button{font:inherit;color:var(--text);background:#262d37;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
select,textarea{width:100%;box-sizing:border-box}
textarea{height:56px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
button{cursor:pointer}button:hover{background:#323b48}
button.primary{background:var(--accent);color:#06121f;border-color:var(--accent)}
.row{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
#out{margin-top:6px;font:12px ui-monospace,Menlo,monospace;color:var(--muted);white-space:pre-wrap;word-break:break-all;max-height:70px;overflow:auto}
#log{flex:1;overflow:auto;padding:6px 12px;font:12px ui-monospace,Menlo,monospace}
#log div{padding:2px 0;border-bottom:1px solid #232a33;word-break:break-all}
.bad{color:var(--bad)}.good{color:var(--good)}.t{color:var(--muted)}
@media (max-width:760px){#app{flex-direction:column}#side{width:auto;height:50%;border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<div id="app">
 <div id="stage"><canvas id="c"></canvas><div id="hud"><span id="hd">head: yaw 0, pitch 0</span><br><span id="msg">Click the screen to tap, drag to swipe.</span></div></div>
 <div id="side">
  <section><h2>Call a tool</h2>
   <input id="flt" placeholder="filter tools" style="width:100%;box-sizing:border-box;margin-bottom:6px">
   <select id="tool"></select>
   <textarea id="args" spellcheck="false">{}</textarea>
   <div class="row"><button class="primary" id="go">Call</button><span id="ut" class="t"></span></div>
   <div id="out"></div></section>
  <section><h2>Gestures (the unit's own)</h2>
   <div class="row" style="margin-top:0"><button data-g="up">Open sheet (swipe up from bottom)</button><button data-g="down">Close sheet (swipe down)</button></div>
   <div class="row"><button data-g="left">Next page (swipe left)</button><button data-g="right">Back to face (swipe right)</button><button data-g="stop">Stop (swipe down from top)</button></div></section>
  <section><h2>Record what you do</h2>
   <div class="row" style="margin-top:0"><button id="recgo">Record</button><button id="recstop" disabled>Stop</button><input id="recname" placeholder="name" style="width:110px"><button id="recsave" disabled>Save</button></div>
   <div id="recmsg" class="t" style="margin-top:6px;font-size:12px">Taps, swipes and tool calls are kept with their waits. Saved files play from the list below ("rec:...").</div></section>
  <section><h2>Scenarios</h2>
   <div class="row" style="margin-top:0"><select id="scen" style="flex:1;width:auto"></select><button id="play">Play</button></div>
   <div id="pl" class="t" style="margin-top:6px;font-size:12px"></div></section>
  <section style="border-bottom:0"><h2>Log (fake clock)</h2></section>
  <div id="log"></div>
 </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id), msg=$('msg');
let TOUCH=false;
async function post(path,body){const r=await fetch(path,{method:'POST',body:JSON.stringify(body||{})});return r.json();}
async function call(name,args){return post('/call',{name,arguments:args||{}});}
// ---- side panel
let TOOLS=[];
function fillTools(){const f=$('flt').value.toLowerCase();$('tool').innerHTML='';
 TOOLS.filter(t=>t.name.includes(f)).forEach(t=>{const o=document.createElement('option');o.value=t.name;o.textContent=t.name+(t.user_only?'  (user only)':'');$('tool').appendChild(o);});pickTool();}
function pickTool(){const t=TOOLS.find(x=>x.name===$('tool').value);if(!t)return;
 const ex={};for(const [k,v] of Object.entries(t.args)) ex[k]=v==='integer'?0:v==='boolean'?false:'';
 $('args').value=JSON.stringify(ex);$('ut').textContent=t.user_only?'hidden from the model, answers by name':'';}
$('flt').oninput=fillTools;$('tool').onchange=pickTool;
$('go').onclick=async()=>{let a={};try{a=JSON.parse($('args').value||'{}');}catch(e){$('out').textContent='The arguments are not valid JSON: '+e.message+'. Fix the text and call again.';return;}
 $('out').textContent=JSON.stringify(await call($('tool').value,a));};
$('play').onclick=async()=>{const r=await post('/scenario',{name:$('scen').value});if(r.isError)$('pl').textContent=r.text;};
fetch('/tools').then(r=>r.json()).then(d=>{TOOLS=d.tools;TOUCH=d.touch;fillTools();if(!TOUCH)msg.textContent='Touch needs the screens renderer (build-screens.sh). The bare face is shown.';});
function loadScenarios(){fetch('/scenarios').then(r=>r.json()).then(d=>{$('scen').innerHTML='';d.scenarios.forEach(n=>{const o=document.createElement('option');o.value=o.textContent=n;$('scen').appendChild(o);});});}
loadScenarios();
const G={up:{kind:'swipe',x:160,y:230,x2:160,y2:120,ms:250},down:{kind:'swipe',x:160,y:150,x2:160,y2:232,ms:250},left:{kind:'swipe',x:280,y:110,x2:40,y2:110,ms:200},right:{kind:'swipe',x:40,y:110,x2:280,y2:110,ms:200},stop:{kind:'swipe',x:160,y:2,x2:160,y2:150,ms:250}};
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>post('/touch',G[b.dataset.g]));
let recOn=false;
function recUi(on,n){recOn=on;$('recgo').disabled=on;$('recstop').disabled=!on;$('recsave').disabled=on||!n;$('recmsg').textContent=on?'Recording... '+n+' steps':(n?n+' steps kept. Name it and press Save.':$('recmsg').textContent);}
$('recgo').onclick=async()=>{await post('/record',{action:'start'});recUi(true,0)};
$('recstop').onclick=async()=>{const r=await post('/record',{action:'stop'});recUi(false,r.steps||0)};
$('recsave').onclick=async()=>{const r=await post('/record',{action:'save',name:$('recname').value});$('recmsg').textContent=r.isError?r.text:'Saved '+r.saved+' ('+r.steps+' steps). Pick rec:'+r.saved+' in Scenarios to replay it.';if(!r.isError)loadScenarios()};
async function pollLog(){try{const d=await (await fetch('/log')).json();
 $('log').innerHTML=d.log.map(e=>`<div class="${e.ok?'good':'bad'}"><span class="t">${(e.at_ms/1000).toFixed(1)}s</span> ${e.name} ${JSON.stringify(e.args)} <span class="t">${JSON.stringify(e.result).slice(0,160)}</span></div>`).join('');
 $('pl').textContent=d.playing?'playing: '+d.playing:'';if(d.recording)recUi(true,d.recorded);}catch(e){}}
setInterval(pollLog,700);pollLog();
// ---- 3D head
if(!window.THREE){msg.textContent='three.js did not load: the 3D drawing needs internet access to cdnjs.cloudflare.com; the flat screen is at /frame.png.';}
else{
const cv=$('c');const r=new THREE.WebGLRenderer({canvas:cv,antialias:true});
const scene=new THREE.Scene();scene.background=new THREE.Color(0x15181d);
const cam=new THREE.PerspectiveCamera(35,1,0.1,100);cam.position.set(0,0.3,9.5);
scene.add(new THREE.HemisphereLight(0xffffff,0x334455,1.1));
const key=new THREE.DirectionalLight(0xffffff,0.8);key.position.set(3,4,5);scene.add(key);
const head=new THREE.Group();scene.add(head);
head.add(new THREE.Mesh(new THREE.BoxGeometry(3.6,2.9,2.4),new THREE.MeshStandardMaterial({color:0xe9edf2,roughness:.5})));
const tex=new THREE.Texture();tex.minFilter=THREE.LinearFilter;
const screen=new THREE.Mesh(new THREE.PlaneGeometry(3.2,2.4),new THREE.MeshBasicMaterial({map:tex}));
screen.position.set(0,0,1.21);head.add(screen);
const bezel=new THREE.Mesh(new THREE.PlaneGeometry(3.4,2.6),new THREE.MeshBasicMaterial({color:0x07090c}));bezel.position.set(0,0,1.205);head.add(bezel);
const base=new THREE.Mesh(new THREE.CylinderGeometry(.5,.7,.7,32),new THREE.MeshStandardMaterial({color:0x2b3440}));base.position.y=-1.9;scene.add(base);
function size(){const w=cv.clientWidth,h=cv.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',size);size();
const img=new Image();img.onload=()=>{tex.image=img;tex.needsUpdate=true;};
setInterval(()=>{img.src='/frame.png?'+Date.now();},100);
const ring=[];
for(let i=0;i<12;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.13,12,12),new THREE.MeshBasicMaterial({color:0x222222}));m.position.set((i-5.5)*0.3,-1.62,1.25);head.add(m);ring.push(m);}
let st={head:{yaw:0,pitch:0},leds:[]};
setInterval(async()=>{try{st=await (await fetch('/state')).json();}catch(e){}},100);
let cy=0,cp=0;
function loop(){cy+=(st.head.yaw*0.6-cy)*.3;cp+=(st.head.pitch-cp)*.3;
 head.rotation.y=-cy*Math.PI/180;head.rotation.x=-cp*Math.PI/180;
 st.leds.forEach((c,i)=>ring[i]&&ring[i].material.color.setRGB(c[0]/255,c[1]/255,c[2]/255));
 $('hd').textContent='head: yaw '+st.head.yaw+', pitch '+st.head.pitch;
 r.render(scene,cam);requestAnimationFrame(loop);}loop();
// ---- touch: a click is a tap, a drag is a swipe, both in panel pixels (320 by 240) found by ray on the screen plane
const ray=new THREE.Raycaster(),v=new THREE.Vector2();
function panelXY(ev){const b=cv.getBoundingClientRect();v.set(((ev.clientX-b.left)/b.width)*2-1,-((ev.clientY-b.top)/b.height)*2+1);
 ray.setFromCamera(v,cam);const hit=ray.intersectObject(screen)[0];if(!hit||!hit.uv)return null;
 return {x:Math.round(hit.uv.x*319),y:Math.round((1-hit.uv.y)*239)};}
let down=null;
cv.addEventListener('pointerdown',e=>{down={p:panelXY(e),cx:e.clientX,cy:e.clientY,t:performance.now()};});
cv.addEventListener('pointerup',async e=>{if(!down||!down.p){down=null;return;}
 const up=panelXY(e)||down.p;const moved=Math.hypot(e.clientX-down.cx,e.clientY-down.cy);
 const body=moved>12?{kind:'swipe',x:down.p.x,y:down.p.y,x2:up.x,y2:up.y,ms:Math.max(120,Math.min(900,performance.now()-down.t))}:{kind:'tap',x:down.p.x,y:down.p.y};
 down=null;const res=await post('/touch',body);if(res.isError)msg.textContent=res.text;});
}
</script></body></html>
