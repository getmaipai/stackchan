name: Bug or feature request
description: Report a problem or ask for something new
body:
  - type: markdown
    attributes:
      value: |
        MaiPai for StackChan is a hobby project. I read everything (eventually), but I may be slow and can't promise to build it. Please don't take silence personally.
  - type: dropdown
    id: kind
    attributes:
      label: What is this?
      options:
        - Something is broken (bug)
        - I want something new (feature request)
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Does it need MaiPai Home?
      options:
        - Works on the bot alone (like a game)
        - Needs MaiPai Home (like notes, a doorbell camera picture or Home Assistant)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, or what do you want?
      description: For a bug, say what you did and what you expected. For a feature, say what you would like it to do.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (bugs only)
      description: If you know it. Leave blank if not.
