name: Bug report
description: Something does not work as the docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Read [Troubleshooting](https://github.com/getmaipai/stackchan/blob/main/docs/user/troubleshooting.md) first.
        Never paste a token, a Wi-Fi password or the pairing code. Remove them before you post.
        For a security problem, do not post details here. Follow SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw.
    validations:
      required: true
  - type: textarea
    id: check-output
    attributes:
      label: Output of `stackchan check`
      description: Run it on the host computer and paste the lines here. Remove any token, password or pairing code.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: On the robot, tap More, then Version.
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
      description: The language set on the settings page.
  - type: dropdown
    id: brain
    attributes:
      label: Brain
      options:
        - Your own model
        - MaiPai Home
        - Small model installed by the host
        - Not sure
  - type: checkboxes
    id: safe
    attributes:
      label: Before you send
      options:
        - label: I removed tokens, Wi-Fi passwords and the pairing code from everything I pasted.
          required: true
