# Select "llm" to run without Home, or "home" to use the Home adapter.
# "standalone" is accepted as an alias for "llm".
brain = "llm"

[llm]
# OpenAI-compatible chat completions endpoint and model name.
url = ""
model = ""
# Optional environment variable containing the model API key. Never put the key here.
# api_key_env = "STACKCHAN_LLM_API_KEY"
# System prompt used for every conversation. The connected model and this prompt own content safety.
persona = "You are a helpful robot. Keep spoken replies concise."
# Request timeout in seconds and the maximum number of prior messages kept per conversation.
timeout_seconds = 30.0
history_messages = 20
# Leave these unset to use the built-in local speech engines.
# stt_url = "http://127.0.0.1:8001"
# tts_url = "http://127.0.0.1:8002"

[home]
# Used only when brain = "home".
url = ""
language = "en"
# Uses setting key names from settings_keys.py.
# quiet_hours_from = "22:00"
# quiet_hours_to = "07:00"

[packages.memory_notes]
# Local memory for several adults: one plain text file per person in the notes folder.
# Say "remember that ...", "forget ...", "what do you remember". Off unless you turn it on.
# enabled = true
# people = ["alex", "sam"]        # lowercase names of the adults who have notes
# default_person = "alex"         # whose notes a turn uses when nobody was identified

[packages.home_assistant]
# Home Assistant voice and camera snapshots. Say "home assistant, turn off the kitchen light".
# The token goes in the environment variable named here, never in this file. Off unless you turn it on.
# enabled = true
# url = "http://192.0.2.20:8123"
# token_env = "STACKCHAN_HA_TOKEN"
# trigger = "home assistant"
# cameras = { "front door" = "camera.front_door" }

[packages.coding_companion]
# The robot shows what a coding agent on this computer is doing: ring light and one soft tone.
# Run `stackchan coding-token`, then have the agent's hook post JSON to 127.0.0.1:8052/status.
# enabled = true
# show_request_text = false      # false: the screen says only "Needs you", "Working" or "Finished"
# port = 8052

[settings]
# Let a phone on your Wi-Fi open the settings page. It then asks for the settings token
# (run `stackchan settings-token`). Off by default: the page is for this computer only.
# lan = true

[remote]
# Remote access starts off and is turned on from the settings page. Uncomment to keep it off whatever the page says.
# enabled = false

# Several robots: one table per unit, found by its Device-Id (run `stackchan units` to list them).
# Anything left out uses the top-level value. Settings saved on the settings page win over these,
# and `stackchan name <device-id> <name>` sets the name people see. Delete the "#" to use one.
# [units.kitchen]
# device_id = "aa:bb:cc:dd:ee:01"      # required: the unit's Device-Id
# persona = "You are a cheerful kitchen helper."   # or paste a pack from host/personas (cooking.en.txt, cooking.es.txt)
# volume_cap = 60                      # 0 to 100
# speech_speed = 1.0                   # 0.75 slow to 1.5 fast
# speech_pitch = 0                     # -12 to 12 semitones
# muted = false
# [units.kitchen.llm]                  # its own model; leave out to use [llm] or Home
# url = "http://192.0.2.10:8080/v1"
# model = "kitchen-model"
# api_key_env = "KITCHEN_LLM_KEY"      # the NAME of the variable, never the key
# [[units.kitchen.alarm]]
# time = "07:30"                       # 24 hour HH:MM
# days = ["mon", "tue", "wed", "thu", "fri"]
# label = "School"
